<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhonePilot — вхід</title><link rel="stylesheet" href="/assets/styles.css"></head><body>
<main class="login-shell"><section class="login-card">
  <div class="brand-row"><span class="brand-mark">RR</span><div><div class="eyebrow">ROBOROUTE</div><h1>Camera Admin</h1></div></div>
  <p class="muted">Админ-панель просмотра low-latency WebRTC-потока с камеры телефона.</p>
  <form id="loginForm" class="form-stack">
    <div class="field"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" value="admin" required></div>
    <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div id="error" class="error-text"></div>
    <button class="primary-button" type="submit">Войти</button>
  </form>
</section></main><script src="/assets/login.js" defer></script></body></html>
